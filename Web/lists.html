<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LikeEat | My Lists</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/lists.css">
  <link rel="shortcut icon" href="images/LikeEat-Logo.ico" type="image/x-icon">
</head>

<body>

  <div class="app">

    <h1 class="title">Mis Listas de Restaurantes</h1>

    <!-- LISTA 1 -->
    <div class="list-section">
      <h2>Favoritos</h2>
      <div class="restaurant-list">
        <div class="restaurant-card">
          <img src="images/pizza.jpg" alt="Pizzería Roma">
          <div class="info">
            <h3>Pizzería Roma</h3>
            <p>Italiana · $$$ </p>
          </div>
        </div>

        <div class="restaurant-card">
          <img src="images/sushi.jpg" alt="Sushi House">
          <div class="info">
            <h3>Sushi House</h3>
            <p>Japonesa · $$$ </p>
          </div>
        </div>
      </div>
    </div>

    <!-- LISTA 2 -->
    <div class="list-section">
      <h2>Para probar</h2>
      <div class="restaurant-list">
        <div class="restaurant-card">
          <img src="images/burger.jpg" alt="Burger King">
          <div class="info">
            <h3>Burger King</h3>
            <p>Hamburguesas · $$ </p>
          </div>
        </div>

        <div class="restaurant-card">
          <img src="images/heladeria.jpg" alt="Heladería Dolce">
          <div class="info">
            <h3>Heladería Dolce</h3>
            <p>Postres · $ </p>
          </div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="lists.html">❤️</a>
      <a href="feed.html">🍽</a>
      <a href="profile.html">👤</a>
    </nav>

  </div>


</body>

</html>

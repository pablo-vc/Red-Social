<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LikeEat | Access</title>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="shortcut icon" href="images/LikeEat-Logo.ico" type="image/x-icon">
</head>

<body>

  <div class="container">
    <div class="card">
      <h1>🍔 LikeEat</h1>
      <p class="subtitle">Descubre los mejores restaurantes cerca de ti</p>

      <input type="radio" name="tab" id="login" checked>
      <input type="radio" name="tab" id="register">

      <div class="tab-buttons">
        <label for="login">Iniciar sesión</label>
        <label for="register">Registrarse</label>
      </div>

      <div class="forms">
        <form class="form login-form">
          <input type="email" placeholder="Correo electrónico" required>
          <input type="password" placeholder="Contraseña" required>
          <button type="submit">Entrar</button>
        </form>

        <form class="form register-form">
          <input type="text" placeholder="Nombre" required>
          <input type="email" placeholder="Correo electrónico" required>
          <input type="password" placeholder="Contraseña" required>
          <input type="password" placeholder="Repetir contraseña" required>
          <button type="submit">Crear cuenta</button>
        </form>
      </div>

    </div>
  </div>
  <nav class="bottom-nav">
    <a href="lists.html">❤️</a>
    <a href="feed.html">🍽</a>
    <a href="profile.html">👤</a>
  </nav>


</body>

</html>
